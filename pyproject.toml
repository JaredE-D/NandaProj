[project]
name = "nandaproj"
version = "0.1.0"
description = "Interp research env for a MATS (Neel Nanda stream) project"
requires-python = ">=3.12"
dependencies = [
    "vastai>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nandaproj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
# Notebooks are research scratch; lint noise there is not worth the churn.
extend-exclude = ["notebooks"]
